spring:
  main:
    banner-mode: off
logging:
  level:
    root: warn

# Every value can be overridden by an environment variable, e.g. HARNESS_DEVICES=5 ./harness run
harness:
  devices: 3            # fake devices, one worker each
  verifier-permits: 2   # how many shared verifications may be in flight at once
  max-attempts: 3       # attempts per test, the first one included
  device-latency: 300ms # how long a fake device takes to act
  verifier-latency: 500ms # how long the shared verifier takes (stands in for an LLM call)
